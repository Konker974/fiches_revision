# docker-compose.yml - Base MySQL + phpMyAdmin (partie II.II, Q.1 -> Q.2)
# Lancement : docker compose up -d
# Les valeurs sensibles viennent du fichier .env (Q.1.2), jamais écrites ici.

services:
  mysql:
    image: mysql:8.4
    container_name: stonewindow_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}          # utilisateur applicatif (pas root)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql        # Q.1.3 : persistance des données
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # Q.2 : monitoring de la base -> http://localhost:${PMA_PORT}
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: stonewindow_pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:   # volume nommé : survit à "docker compose down"
